# eval.yaml — registers a distribution-fidelity panel as a Hub Benchmark.
#
# Historical unsent draft. At authoring, fidelity-kld was absent from the
# framework enum and the dataset was not allow-listed; current remote status
# has not been rechecked. See OUTREACH.md for the proposal and limitations.
#
# This benchmark is unlike the QA benchmarks currently registered. It does not
# score a model against human-authored answers; it measures how far a model's
# full output DISTRIBUTION has moved from a reference model's, on frozen token
# IDs, teacher-forced. Lower is better within a comparable design; this is
# distributional drift, not causal quantization damage or task accuracy.

name: GLM-5.3-Flash distribution fidelity (sealed 25-window panel)
description: >
  Mean KL divergence D(reference || candidate) in nats over the FULL vocabulary
  (154,880 entries), fp64 accumulation, teacher-forced, on a sealed panel of 25
  windows x 2,048 tokens (51,175 scored positions). The reference is
  zai-org/GLM-5.3-Flash-BF16 at a pinned revision; frozen token IDs are published
  with a hash. Lower is better within a comparable design; computed 0.0 alone
  does not prove bitwise logit identity. Panel, reference, direction, estimator,
  scope, lane and capture/replay provenance must satisfy the full pair predicate;
  task ids and free-text notes alone cannot enforce that contract. This selected
  finite panel is descriptive, not a probability sample of deployment.

evaluation_framework: fidelity-kld

tasks:
  # Reference forward (transformers), characterizes the CHECKPOINT.
  # Repeatability requires the recorded tensor/KL digests, not only equal means.
  - id: glm53_flash_final25_checkpoint
    config: default
    split: test

  # Through a serving engine, characterizes WEIGHTS + KERNELS + any
  # activation quantization together. The -8.5e-6 historical K6 bridge is
  # streaming-versus-sealed, NOT serving-versus-checkpoint, and not portable.
  - id: glm53_flash_final25_serving
    config: default
    split: test

  # The same panel restricted to the 17 windows that survive a 13-gram
  # calibration-overlap scan. Reported alongside, never instead.
  - id: glm53_flash_clean17_checkpoint
    config: default
    split: test
